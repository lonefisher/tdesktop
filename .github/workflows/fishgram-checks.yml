name: Fishgram source checks
on:
  pull_request:
  push:
    branches: [custom/main, 'ci/**']
  workflow_dispatch:
    inputs:
      use_github_hosted:
        description: Force GitHub-hosted windows-2022 instead of the build PC
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helpers:
    name: Production helper tests
    # Different fishgram pin in product/; keep it off the persistent build-PC tree.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lonefisher/fishgram
          ref: 0bb8a013b460383a05d92253459c9d06141ec7cd
          path: product
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test actual production helpers
        shell: pwsh
        run: |
          ./product/tools/test-restricted-search.ps1 -SourceRoot "$PWD/source" -OutputDirectory "$PWD/build-tests"
          ./product/tools/test-restricted-search-integration.ps1 -SourceRoot "$PWD/source" -OutputDirectory "$PWD/build-search-integration-tests"
          python -m unittest discover -s product/tests -p test_data_recovery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  warmup:
    name: Warm dependency cache
    # Only custom/main may write the cache that pull requests restore.
    if: >-
      github.ref == 'refs/heads/custom/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Fork PRs and use_github_hosted use windows-2022. Otherwise queue for fishgram-builder.
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event.inputs.use_github_hosted == 'true') && '["windows-2022"]' || '["self-hosted", "Windows", "X64", "fishgram-builder"]') }}
    timeout-minutes: 350
    cache-mode: write
    permissions:
      actions: write
      contents: read
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lonefisher/fishgram
          ref: 5345fdaa01d17fb5cfef48dd0e8234f24fc7a863
          path: product
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product/tdesktop
          submodules: recursive
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
      - name: Check out every pinned recursive dependency
        shell: pwsh
        working-directory: product/tdesktop
        run: |
          git submodule update --init --recursive --checkout
          if ($LASTEXITCODE) { throw 'Pinned recursive dependency checkout failed.' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind this test-only input to the actual source commit
        shell: pwsh
        working-directory: product
        run: |
          $sha=git -C tdesktop rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git update-index --cacheinfo "160000,$sha,tdesktop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $recipe=Get-Content -Raw fishgram.json | ConvertFrom-Json
          $version=Get-Content -Raw tdesktop/Telegram/build/version
          if ($version -notmatch '(?m)^AppVersionStr\s+(\d+\.\d+\.\d+)\s*\r?$') { throw 'Unknown source version' }
          $recipe.upstreamVersion=$Matches[1]
          $recipe.releaseReady=$false
          $recipe | ConvertTo-Json -Depth 4 | Set-Content fishgram.json
      - name: Require PowerShell 7 on the build PC
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            throw 'The build PC needs PowerShell 7. Install it machine-wide so pwsh is on PATH for the runner service. See .github/self-hosted-windows-runner.md.'
          }
      - name: Pin MSVC 14.44 on the build PC
        if: runner.environment == 'self-hosted'
        shell: pwsh
        working-directory: product
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & ./tdesktop/.github/scripts/pin-msvc-14-44.ps1 -ProductRoot $PWD.Path
      - name: Exact dependency cache identity
        id: key
        if: runner.environment == 'github-hosted'
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not $env:ImageVersion -or -not $env:ImageOS) { throw 'Runner image version is required for the dependency cache key.' }
          . ./tools/common.ps1
          $recipe = Get-FishGramRecipe (Get-Location).Path
          $toolchain = Get-FishGramToolchain $recipe
          $root = (Get-Location).Path
          $script = Join-Path $root 'tdesktop/.github/scripts/windows_dependency_cache.py'
          $key = & python -u $script key --root $root --runner-label windows-2022 --msvc-toolset "$($toolchain.msvc)" --image-version "$($env:ImageVersion)" --image-os "$($env:ImageOS)" --github-output "$($env:GITHUB_OUTPUT)"
          if ($LASTEXITCODE) { throw 'Dependency cache identity failed.' }
          $key = "$key".Trim()
          if ($key -notmatch '^fishgram-checks-deps-v1-[0-9a-f]{64}$') { throw "Bad dependency cache key: $key" }
          $head = git -C tdesktop rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Source identity failed.' }
          Write-Output "Source commit is not part of the dependency cache key: $head"
      - name: Look up the exact dependency cache
        id: cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          lookup-only: true
          path: ${{ runner.temp }}/fishgram-dependencies-v3.zip
          key: ${{ steps.key.outputs.key }}
      - name: Prepare dependencies when the exact cache is absent
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: product
        run: ./tools/prepare-dependencies.ps1 -Silent
      - name: Print dependency directory sizes
        if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: product
        run: |
          python -u ./tdesktop/.github/scripts/windows_dependency_cache.py report --root .
          if ($LASTEXITCODE) { throw 'Dependency size report failed.' }
      - name: Reject credential-like files before caching
        if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: product
        run: |
          python -u ./tdesktop/.github/scripts/windows_dependency_cache.py guard --root .
          if ($LASTEXITCODE) { throw 'Dependency cache rejected credential-like files.' }
      - name: Pack dependencies and record the compressed archive size
        id: pack
        if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: product
        run: |
          python -u ./tools/dependency_cache_archive.py pack --archive "$env:RUNNER_TEMP/fishgram-dependencies-v3.zip" --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE) { throw 'Dependency snapshot exceeded the 8 GB archive budget or could not be packed.' }
      - name: Save the dependency cache from custom/main
        if: >-
          runner.environment == 'github-hosted' &&
          steps.cache.outputs.cache-hit != 'true' &&
          steps.pack.outputs.ready == 'true' &&
          github.ref == 'refs/heads/custom/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fishgram-dependencies-v3.zip
          key: ${{ steps.key.outputs.key }}
  compile:
    name: Source test identity compile
    needs: warmup
    if: >-
      always() &&
      !cancelled() &&
      (needs.warmup.result == 'success' || needs.warmup.result == 'skipped') &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    # Fork PRs and use_github_hosted use windows-2022. Otherwise queue for fishgram-builder.
    runs-on: ${{ fromJSON(((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event.inputs.use_github_hosted == 'true') && '["windows-2022"]' || '["self-hosted", "Windows", "X64", "fishgram-builder"]') }}
    timeout-minutes: 350
    cache-mode: read
    permissions:
      actions: write
      contents: read
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lonefisher/fishgram
          ref: 5345fdaa01d17fb5cfef48dd0e8234f24fc7a863
          path: product
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product/tdesktop
          submodules: recursive
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
      - name: Check out every pinned recursive dependency
        shell: pwsh
        working-directory: product/tdesktop
        run: |
          git submodule update --init --recursive --checkout
          if ($LASTEXITCODE) { throw 'Pinned recursive dependency checkout failed.' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind this test-only input to the actual source commit
        shell: pwsh
        working-directory: product
        run: |
          $sha=git -C tdesktop rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git update-index --cacheinfo "160000,$sha,tdesktop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $recipe=Get-Content -Raw fishgram.json | ConvertFrom-Json
          $version=Get-Content -Raw tdesktop/Telegram/build/version
          if ($version -notmatch '(?m)^AppVersionStr\s+(\d+\.\d+\.\d+)\s*\r?$') { throw 'Unknown source version' }
          $recipe.upstreamVersion=$Matches[1]
          $recipe.releaseReady=$false
          $recipe | ConvertTo-Json -Depth 4 | Set-Content fishgram.json
      - name: Require PowerShell 7 on the build PC
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            throw 'The build PC needs PowerShell 7. Install it machine-wide so pwsh is on PATH for the runner service. See .github/self-hosted-windows-runner.md.'
          }
      - name: Pin MSVC 14.44 on the build PC
        if: runner.environment == 'self-hosted'
        shell: pwsh
        working-directory: product
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & ./tdesktop/.github/scripts/pin-msvc-14-44.ps1 -ProductRoot $PWD.Path
      - name: Exact dependency cache identity
        id: key
        if: runner.environment == 'github-hosted'
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not $env:ImageVersion -or -not $env:ImageOS) { throw 'Runner image version is required for the dependency cache key.' }
          . ./tools/common.ps1
          $recipe = Get-FishGramRecipe (Get-Location).Path
          $toolchain = Get-FishGramToolchain $recipe
          $root = (Get-Location).Path
          $script = Join-Path $root 'tdesktop/.github/scripts/windows_dependency_cache.py'
          $key = & python -u $script key --root $root --runner-label windows-2022 --msvc-toolset "$($toolchain.msvc)" --image-version "$($env:ImageVersion)" --image-os "$($env:ImageOS)" --github-output "$($env:GITHUB_OUTPUT)"
          if ($LASTEXITCODE) { throw 'Dependency cache identity failed.' }
          $key = "$key".Trim()
          if ($key -notmatch '^fishgram-checks-deps-v1-[0-9a-f]{64}$') { throw "Bad dependency cache key: $key" }
          $head = git -C tdesktop rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Source identity failed.' }
          Write-Output "Source commit is not part of the dependency cache key: $head"
      # Read-only. A pull request must not save or replace this cache.
      - name: Restore the exact dependency cache
        id: cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/fishgram-dependencies-v3.zip
          key: ${{ steps.key.outputs.key }}
      - name: Unpack the exact dependency snapshot
        if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit == 'true'
        shell: pwsh
        working-directory: product
        run: |
          python -u ./tools/dependency_cache_archive.py restore --archive "$env:RUNNER_TEMP/fishgram-dependencies-v3.zip"
          if ($LASTEXITCODE) { throw 'Dependency restore failed.' }
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/fishgram-dependencies-v3.zip" -Force
      - name: Recreate runner-local Python after cache restore
        if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit == 'true'
        shell: pwsh
        working-directory: product
        run: ./tools/refresh-build-python.ps1
      - name: Prepare exact PR dependencies without credentials or cache writes
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: product
        run: ./tools/prepare-dependencies.ps1 -Silent
      - name: Drop stale diagnostics from the persistent work tree
        if: runner.environment == 'self-hosted'
        shell: pwsh
        working-directory: product
        run: |
          $reports = Join-Path $PWD 'reports'
          if (Test-Path -LiteralPath $reports) {
            Get-ChildItem -LiteralPath $reports -Filter '*-diagnostics.json' -File | Remove-Item -Force
          }
      - name: Compile test identity, never upload client or raw logs
        shell: pwsh
        working-directory: product
        run: ./tools/build-telegram.ps1 -TestIdentity -Parallel 4
      - name: Stage a portable Windows test folder
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'product\build-modified\Release'
          $exe = Join-Path $release 'Telegram.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Test build is missing $exe"
          }
          $stage = Join-Path $env:RUNNER_TEMP 'fishgram-windows-test'
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'Telegram.exe')
          Get-ChildItem -LiteralPath $release -File -Filter '*.dll' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $stage $_.Name)
          }
          $modules = Join-Path $release 'modules'
          if (Test-Path -LiteralPath $modules -PathType Container) {
            Copy-Item -LiteralPath $modules -Destination (Join-Path $stage 'modules') -Recurse
          }
          $data = Join-Path $stage 'FishGramData'
          New-Item -ItemType Directory -Path $data | Out-Null
          @(
            'Portable data for this test build.'
            'Start-FishGram.cmd passes -workdir to this folder.'
            'Do not delete it. The test client must not use %APPDATA%\FishGram.'
          ) | Set-Content -LiteralPath (Join-Path $data 'PORTABLE.txt') -Encoding ascii
          $launcher = @(
            '@echo off'
            'setlocal'
            'if not exist "%~dp0FishGramData\" mkdir "%~dp0FishGramData"'
            'start "" "%~dp0Telegram.exe" -workdir "%~dp0FishGramData"'
          ) -join "`r`n"
          Set-Content -LiteralPath (Join-Path $stage 'Start-FishGram.cmd') -Value ($launcher + "`r`n") -Encoding ascii
          $readme = @(
            'Fishgram Windows test build. Not a release.'
            ''
            'Unzip into a new writable folder. Keep FishGramData next to Telegram.exe.'
            'Start with Start-FishGram.cmd. It runs Telegram.exe -workdir FishGramData.'
            'Account data and log.txt stay in that FishGramData folder.'
            'This does not read or write %APPDATA%\FishGram.'
            'Do not copy Telegram.exe into an installed Fishgram directory.'
            ''
            'A normal Telegram account can sign in. This build uses the public'
            'Telegram Desktop API identity (api_id 611335), so the login is a'
            'separate session from an installed Fishgram.'
            ''
            'VSR log line, in FishGramData\log.txt:'
            'VSR Info: NVIDIA RTX video super resolution is active.'
          ) -join "`r`n"
          Set-Content -LiteralPath (Join-Path $stage 'README.txt') -Value ($readme + "`r`n") -Encoding ascii
          $bytes = (Get-ChildItem -LiteralPath $stage -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Output ("Staged portable test folder bytes: " + $bytes)
          Get-ChildItem -LiteralPath $stage -Recurse | ForEach-Object { Write-Output $_.FullName }
      - name: Upload portable Windows test build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fishgram-windows-test
          path: ${{ runner.temp }}/fishgram-windows-test
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Sanitized build diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-build-diagnostics
          path: product/reports/*-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
